name: pyproject-fmt Android Wheels

on:
  workflow_dispatch:
    inputs:
      force_build:
        type: boolean
        default: false

env:
  PACKAGE_NAME: pyproject-fmt
  NDK_VERSION: '25.2.9519653'
  ANDROID_API: 24

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pypi.outputs.version }}
      should_build: ${{ steps.check_release.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - id: pypi
        run: |
          VER=$(curl -s https://pypi.org/pypi/${{ env.PACKAGE_NAME }}/json | python3 -c "import sys, json; print(json.load(sys.stdin)['info']['version'])")
          echo "version=$VER" >> $GITHUB_OUTPUT
      - id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force_build }}
        run: |
          VER="${{ steps.pypi.outputs.version }}"; TAG="v${{ env.PACKAGE_NAME }}-$VER"
          if [ "$FORCE" == "true" ]; then echo "should_build=true" >> $GITHUB_OUTPUT; exit 0; fi
          if gh release view "$TAG" > /dev/null 2>&1; then echo "should_build=false" >> $GITHUB_OUTPUT
          else echo "should_build=true" >> $GITHUB_OUTPUT; fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
        arch: ['arm64-v8a']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust & Targets
        run: |
          pip install maturin
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
      - name: Build Wheel
        id: build_step
        run: |
          set -e; source "$HOME/.cargo/env"
          PY_VER="${{ matrix.python-version }}"; PKG_VER="${{ needs.check-version.outputs.version }}"
          ARCH="${{ matrix.arch }}"; API="${{ env.ANDROID_API }}"
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"; export PATH="$NDK_BIN:$PATH"
          RUST_TARGET="aarch64-linux-android"; CT="aarch64-linux-android${API}"; PT="linux_aarch64"
          LINKER_VAR="CARGO_TARGET_$(echo $RUST_TARGET | tr '[:lower:]-' '[:upper:]_')_LINKER"
          [ -f "$NDK_BIN/${CT}-clang" ] && export $LINKER_VAR="$NDK_BIN/${CT}-clang" || export $LINKER_VAR="$NDK_BIN/clang"
          MOCK_DIR="$(pwd)/mock_libs"; mkdir -p "$MOCK_DIR"
          "$NDK_BIN/clang" --target=$CT -shared -Wl,-soname,libpython$PY_VER.so -o "$MOCK_DIR/libpython$PY_VER.so" -xc /dev/null
          SYSCONFIG_NAME="_sysconfigdata__linux_${RUST_TARGET}"
          cat > "$MOCK_DIR/${SYSCONFIG_NAME}.py" <<EOF
          build_time_vars = {
              'abiflags': '', 'ABIFLAGS': '',
              'SO': '.so', 'SOABI': 'cpython-$PY_VER', 'EXT_SUFFIX': '.so',
              'LIBDIR': '$MOCK_DIR', 'LDLIBRARY': 'libpython$PY_VER.so',
              'Py_ENABLE_SHARED': 1, 'CC': 'clang', 'CXX': 'clang++',
              'VERSION': '$PY_VER', 'LDSHARED': 'clang -shared',
              'LDFLAGS': '-L$MOCK_DIR', 'CCSHARED': '-fPIC', 'GNULD': 'yes',
              'Py_DEBUG': 0, 'WITH_PYMALLOC': 1,
          }
          EOF
          RUSTFLAGS_VAR="CARGO_TARGET_$(echo $RUST_TARGET | tr '[:lower:]-' '[:upper:]_')_RUSTFLAGS"
          export $RUSTFLAGS_VAR="-L native=$MOCK_DIR -C link-arg=--target=$CT -C link-arg=-Wl,--no-as-needed -C link-arg=-lpython$PY_VER -C link-arg=-Wl,--as-needed -C link-arg=-Wl,--unresolved-symbols=ignore-all -C link-arg=-Wl,-rpath=/data/data/com.termux/files/usr/lib"
          mkdir -p build_src && cd build_src
          pip download "${{ env.PACKAGE_NAME }}==$PKG_VER" --no-binary :all: --no-deps
          tar -xzf pyproject_fmt-*.tar.gz; cd pyproject_fmt-*
          export PYO3_CROSS_LIB_DIR="$MOCK_DIR"; export PYTHONPATH="$MOCK_DIR:$PYTHONPATH"
          export PYO3_CROSS_PYTHON_VERSION="$PY_VER"; export _PYTHON_SYSCONFIGDATA_NAME="$SYSCONFIG_NAME"
          maturin build --release --strip --target "$RUST_TARGET" --interpreter python$PY_VER --skip-auditwheel
          cd target/wheels; OLD=$(ls *.whl)
          NEW=$(echo "$OLD" | sed -E "s/(-[^-]+)\.whl$/-${PT}.whl/"); mv "$OLD" "$NEW"
          echo "WHEEL_PATH=$(pwd)/$NEW" >> $GITHUB_OUTPUT
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python-version }}-${{ matrix.arch }}
          path: ${{ steps.build_step.outputs.WHEEL_PATH }}
          retention-days: 1
  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PACKAGE_NAME }}-${{ needs.check-version.outputs.version }}
          name: ${{ env.PACKAGE_NAME }} v${{ needs.check-version.outputs.version }}
          body: |
            ### Automated Android Build
            **Package:** `${{ env.PACKAGE_NAME }}`
            - **OS:** Android (Termux)
            - **Arch:** aarch64
            - **Python:** 3.14
          files: wheels/*.whl
          make_latest: false