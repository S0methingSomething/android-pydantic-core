name: Update PyPI Index

on:
  workflow_dispatch:
  release:
    types: [published, edited, released, deleted]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-index:
    name: Generate PEP 503 Index
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Static Site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p site

          cat <<'EOF' > generate_index.py
          import os
          import json
          import subprocess
          import sys
          import re

          repo = os.environ['REPO']

          print(f"🔍 Fetching releases from API for {repo}...")
          cmd = ["gh", "api", f"repos/{repo}/releases", "--paginate"]
          result = subprocess.run(cmd, capture_output=True, text=True)
          if result.returncode != 0:
              print(f"❌ API Error: {result.stderr}")
              sys.exit(1)
          try:
              releases = json.loads(result.stdout)
          except json.JSONDecodeError:
              print("❌ Error decoding JSON response")
              sys.exit(1)

          def normalize(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          by_pkg = {}  # normalized_pkg -> list of (name, download_url)

          for release in releases:
              if release.get('draft'):
                  continue
              for asset in release.get('assets', []):
                  name = asset['name']
                  url = asset.get('browser_download_url')
                  if not name.endswith('.whl') or not url:
                      continue
                  # Format: <pkg>-<ver>-<py>-<abi>-<plat>.whl
                  pkg = name.split('-', 1)[0]
                  if pkg == 'pydantic':
                      # pydantic_core-2.47.0-... or pydantic_core-...
                      pkg = name.split('-', 3)[0]
                      if pkg == 'pydantic':
                          pkg = 'pydantic_core'
                  norm = normalize(pkg)
                  by_pkg.setdefault(norm, []).append((name, url))

          site_dir = "site"
          total = 0
          for pkg, links in sorted(by_pkg.items()):
              target_dir = f"{site_dir}/{pkg}"
              os.makedirs(target_dir, exist_ok=True)
              html_links = [f'<a href="{url}">{name}</a>' for (name, url) in links]
              html = f"""<!DOCTYPE html>
          <html>
          <body>
              <h1>Links for {pkg}</h1>
              {'<br>'.join(html_links)}
          </body>
          </html>"""
              with open(f"{target_dir}/index.html", "w") as f:
                  f.write(html)
              total += len(links)
              print(f"✅ {pkg}: {len(links)} wheels")

          root_html = """<!DOCTYPE html>
          <html>
          <body>
          """
          for pkg in sorted(by_pkg.keys()):
              root_html += f'<a href="{pkg}/">{pkg}</a><br>'
          root_html += "</body></html>"
          with open(f"{site_dir}/index.html", "w") as f:
              f.write(root_html)

          print(f"✅ Total: {total} wheels across {len(by_pkg)} packages")
          EOF

          python3 generate_index.py


      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build-index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4